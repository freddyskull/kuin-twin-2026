version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: kuin-twin-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kuin_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kuin-twin-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kuin-twin-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/kuin_twin?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super-secret-token-2026
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  web-store:
    build:
      context: .
      dockerfile: apps/web-store/Dockerfile
    container_name: kuin-twin-web-store
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - api

  migrator:
    image: node:20-alpine
    container_name: kuin-twin-migrator
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/kuin_twin?schema=public
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install prisma@7.3.0 dotenv typescript ts-node @types/node --no-save --legacy-peer-deps && npx prisma migrate dev --name init"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
