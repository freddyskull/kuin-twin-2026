services:
  db:
    image: postgis/postgis:15-3.3
    container_name: kuin-twin-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kuin_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kuin-twin-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kuin-twin-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/kuin_twin?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-token-2026
      - PORT=3001
    volumes:
      - uploads_data:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web-store:
    build:
      context: .
      dockerfile: apps/web-store/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: kuin-twin-web-store
    restart: always
    depends_on:
      - api

  admin-panel:
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: kuin-twin-admin-panel
    restart: always
    depends_on:
      - api

  gateway:
    image: nginx:alpine
    container_name: kuin-twin-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      - web-store
      - admin-panel
      - api

volumes:
  postgres_data:
  redis_data:
  uploads_data:
